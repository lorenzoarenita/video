<!doctype html><html><body style="margin:0;background:#000"><canvas id="c"></canvas><script>
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
function compile(gl, type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(gl, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function setParams(gl, prog, params) {
  for (const [k, v] of Object.entries(params)) {
    const loc = gl.getUniformLocation(prog, 'p_' + k);
    if (!loc) continue;
    const a = Array.isArray(v) ? v : [v];
    [gl.uniform1fv, gl.uniform2fv, gl.uniform3fv, gl.uniform4fv][a.length - 1].call(gl, loc, a);
  }
}
// params may contain keyframes: {"k": [[t,v],[t,v]]} -> interpolated (smoothstep)
function evalParams(params, t) {
  const out = {};
  for (const [k, v] of Object.entries(params)) {
    if (Array.isArray(v) && Array.isArray(v[0])) {
      let val = v[0][1];
      if (t >= v[v.length - 1][0]) val = v[v.length - 1][1];
      else for (let i = 0; i < v.length - 1; i++) {
        const [t0, a] = v[i], [t1, b] = v[i + 1];
        if (t >= t0 && t < t1) {
          let x = (t - t0) / (t1 - t0); x = x * x * (3 - 2 * x);
          val = Array.isArray(a) ? a.map((ai, j) => ai + (b[j] - ai) * x) : a + (b - a) * x;
          break;
        }
      }
      out[k] = val;
    } else out[k] = v;
  }
  return out;
}
window.run = async (cfg) => {
  try {
    const c = document.getElementById('c');
    c.width = cfg.w; c.height = cfg.h;
    const gl = c.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
    gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
    const hdr = `#version 300 es
precision highp float; precision highp int;
uniform vec2 uRes; uniform float uTime; uniform float uDur; uniform float uFrame; uniform float uSeed; uniform float uFade;
out vec4 fragColor;
`;
    const texs = [];
    const dummy = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, dummy);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    for (const tp of cfg.tex) {
      const img = new Image(); img.src = '/tex/' + encodeURIComponent(tp); await img.decode();
      const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      texs.push(tx);
    }
    const sceneProg = program(gl, hdr + 'uniform sampler2D uTex0, uTex1, uTex2, uTex3, uTex4, uTex5;\n' + cfg.frag + `
void main(){ vec2 uv = gl_FragCoord.xy / uRes; vec3 c = scene(uv, uTime); fragColor = vec4(max(c, 0.), 1.); }`);
    const postProg = program(gl, hdr + 'uniform sampler2D uScene;\n' + cfg.post);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const sw = cfg.w * cfg.ss, sh = cfg.h * cfg.ss;
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    const levels = Math.floor(Math.log2(Math.max(sw, sh))) + 1;
    gl.texStorage2D(gl.TEXTURE_2D, levels, gl.RGBA16F, sw, sh);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const px = new Uint8Array(cfg.w * cfg.h * 4);
    const frames = cfg.frames || Array.from({ length: cfg.n }, (_, i) => i);
    for (const f of frames) {
      const t = f / cfg.fps + cfg.tOffset;
      const lt = f / cfg.fps;
      let fade = 1;
      if (cfg.fadeIn > 0) fade = Math.min(fade, lt / cfg.fadeIn);
      if (cfg.fadeOut > 0) fade = Math.min(fade, (cfg.dur - lt) / cfg.fadeOut);
      fade = Math.max(0, Math.min(1, fade)); fade = fade * fade * (3 - 2 * fade);
      const P = evalParams(cfg.params, lt);
      for (const [prog, w, h] of [[sceneProg, sw, sh], [postProg, cfg.w, cfg.h]]) {
        gl.useProgram(prog);
        gl.uniform2f(gl.getUniformLocation(prog, 'uRes'), w, h);
        gl.uniform1f(gl.getUniformLocation(prog, 'uTime'), t);
        gl.uniform1f(gl.getUniformLocation(prog, 'uDur'), cfg.dur);
        gl.uniform1f(gl.getUniformLocation(prog, 'uFrame'), f);
        gl.uniform1f(gl.getUniformLocation(prog, 'uSeed'), cfg.seed);
        gl.uniform1f(gl.getUniformLocation(prog, 'uFade'), fade);
        setParams(gl, prog, P);
        if (prog === sceneProg) {
          for (let i = 0; i < 6; i++) { gl.activeTexture(gl.TEXTURE1 + i); gl.bindTexture(gl.TEXTURE_2D, texs[i] || dummy); gl.uniform1i(gl.getUniformLocation(prog, 'uTex' + i), 1 + i); }
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dummy);
          gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.viewport(0, 0, w, h);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.bindTexture(gl.TEXTURE_2D, tex); gl.generateMipmap(gl.TEXTURE_2D);
        } else {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, w, h);
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.uniform1i(gl.getUniformLocation(prog, 'uScene'), 0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
      }
      gl.readPixels(0, 0, cfg.w, cfg.h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      await fetch('/frame', { method: 'POST', body: px });
    }
    return 'ok';
  } catch (e) { return String(e && e.message || e); }
};
</script></body></html>
